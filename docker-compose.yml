services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contador-kast-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3000}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8080"]
      interval: 30s
      timeout: 3s
      retries: 3
